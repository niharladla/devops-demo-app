
trigger: none

resources:
  pipelines:
    - pipeline: ci
      source: niharladla.devops-demo-app
      trigger: true

pool:
  vmImage: 'windows-latest'

stages:
  - stage: Deploy_QA
    displayName: 'Deploy to QA'

    jobs:
      - deployment: DeployQA
        displayName: 'Deploy application to QA'
        environment: QA

        strategy:
          runOnce:
            deploy:
              steps:
                - download: ci
                  artifact: drop

                - task: AzureWebApp@1
                  displayName: 'Deploy to QA App Service'
                  inputs:
                    azureSubscription: 'sc-azure-devops-demo'
                    appType: 'webAppLinux'
                    appName: 'devops-demo-nihar-qa'
                    package: '$(Pipeline.Workspace)/ci/drop'
