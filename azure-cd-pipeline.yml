
trigger: none

resources:
  pipelines:
    - pipeline: ci
      source: niharladla.devops-demo-app
      trigger: true

pool:
  vmImage: 'windows-latest'

steps:
  - task: DownloadPipelineArtifact@2
    displayName: 'Download CI artifact'
    inputs:
      buildType: 'specific'
      project: '$(System.TeamProject)'
      pipeline: '$(resources.pipeline.ci.pipelineID)'
      buildVersionToDownload: 'specific'
      buildId: '$(resources.pipeline.ci.runID)'
      artifactName: 'drop'
      targetPath: '$(Pipeline.Workspace)/drop'

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure App Service'
    inputs:
      azureSubscription: 'sc-azure-devops-demo'
      appType: 'webAppLinux'
      appName: 'devops-demo-nihar'
      package: '$(Pipeline.Workspace)/drop'
